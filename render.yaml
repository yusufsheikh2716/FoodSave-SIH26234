services:
  # 1. Python AI / ML Microservice (FastAPI)
  - type: web
    name: foodsave-ml-service
    runtime: python
    rootDir: ml-service
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && python training/train_meal_model.py && python training/train_shelf_life_model.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # 2. Node.js Backend API & Real-Time Engine (Express + Socket.io + Prisma)
  - type: web
    name: foodsave-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && npx tsx prisma/seed.ts && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.14.0
      - key: DATABASE_URL
        fromDatabase:
          name: foodsave-db
          property: connectionString
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: foodsave-ml-service
          property: host
      - key: JWT_SECRET
        generateValue: true
      - key: CO2_FACTOR_KG_PER_KG
        value: "2.5"
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: REDIS_URL
        sync: false # Set to Upstash Redis URL or managed Redis connection string

databases:
  # Managed PostgreSQL Database
  - name: foodsave-db
    plan: free
    region: oregon
    databaseName: foodsave
    user: foodsave
